type Profile @entity {
  id: Bytes! # address
  username: String!
  profileId: BigInt!
  createdAt: BigInt!
  avatarCid: String
  activities: [Activity!]! @derivedFrom(field: "user")
  territories: [Territory!]! @derivedFrom(field: "owner")
  contributions: [Contribution!]! @derivedFrom(field: "user")
  achievements: [Achievement!]! @derivedFrom(field: "recipient")
  challengesAsChallenger: [Challenge!]! @derivedFrom(field: "challenger")
  challengesAsOpponent: [Challenge!]! @derivedFrom(field: "opponent")
}

type Activity @entity {
  id: Bytes! # txHash-logIndex
  activityId: BigInt!
  user: Profile!
  activityHash: Bytes!
  activityType: Int!
  distance: BigInt!
  duration: BigInt!
  territoryArea: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type Territory @entity {
  id: Bytes! # territoryId
  owner: Profile!
  area: BigInt!
  strength: BigInt!
  capturedAt: BigInt!
  lastReinforced: BigInt!
  isActive: Boolean!
}

type Season @entity {
  id: String! # seasonId
  startTime: BigInt!
  endTime: BigInt!
  isActive: Boolean!
  totalContributions: BigInt!
  participantCount: BigInt!
  contributions: [Contribution!]! @derivedFrom(field: "season")
}

type Contribution @entity {
  id: Bytes! # txHash-logIndex
  season: Season!
  user: Profile!
  distance: BigInt!
  recordedAt: BigInt!
}

type AchievementDefinition @entity {
  id: Bytes! # achievementId
  name: String!
}

type Achievement @entity {
  id: String! # tokenId
  recipient: Profile!
  achievementId: Bytes!
  definition: AchievementDefinition
  mintedAt: BigInt!
}

type Challenge @entity {
  id: String! # challengeId
  challenger: Profile!
  opponent: Profile!
  activityType: Int!
  targetMetric: BigInt!
  deadline: BigInt!
  stake: BigInt!
  status: String! # Open | Accepted | Settled | Cancelled
  winner: Bytes
  loser: Bytes
  payout: BigInt
  createdAt: BigInt!
  withdrawn: Boolean! # true once at least one payout for this challenge has been claimed
  challengerWithdrawn: Boolean! # true once the challenger has claimed their own stake/payout
  opponentWithdrawn: Boolean! # true once the opponent has claimed their own stake/payout
  withdrawnAt: BigInt # timestamp of the most recent withdrawal
}

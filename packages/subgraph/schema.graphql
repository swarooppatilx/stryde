type Profile @entity(immutable: false) {
  id: Bytes! # address
  username: String!
  profileId: BigInt!
  createdAt: BigInt!
  avatarCid: String
  isVerified: Boolean!
  verifiedAt: BigInt
  activities: [Activity!]! @derivedFrom(field: "user")
  territories: [Territory!]! @derivedFrom(field: "owner")
  contributions: [Contribution!]! @derivedFrom(field: "user")
  achievements: [Achievement!]! @derivedFrom(field: "recipient")
  challengesAsChallenger: [Challenge!]! @derivedFrom(field: "challenger")
  challengesAsOpponent: [Challenge!]! @derivedFrom(field: "opponent")
  groupsOwned: [Group!]! @derivedFrom(field: "owner")
  groupMemberships: [GroupMember!]! @derivedFrom(field: "user")
  kudosGiven: [ActivityKudos!]! @derivedFrom(field: "giver")
  commentsAuthored: [ActivityComment!]! @derivedFrom(field: "author")
  eventsHosted: [Event!]! @derivedFrom(field: "host")
  eventParticipations: [EventParticipant!]! @derivedFrom(field: "user")
}

type Activity @entity(immutable: false) {
  id: Bytes! # activityId (utf8-encoded)
  activityId: BigInt!
  user: Profile!
  activityHash: Bytes!
  activityType: Int!
  distance: BigInt!
  duration: BigInt!
  territoryArea: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  metadataCid: String
  kudos: [ActivityKudos!]! @derivedFrom(field: "activity")
  comments: [ActivityComment!]! @derivedFrom(field: "activity")
}

type Territory @entity(immutable: false) {
  id: Bytes! # territoryId
  owner: Profile!
  area: BigInt!
  strength: BigInt!
  capturedAt: BigInt!
  lastReinforced: BigInt!
  isActive: Boolean!
  # 1e6-fixed-point bounding box (same encoding as the contract args) —
  # enables drawing others' territory polygons / a heatmap without reading the
  # contract per-territory.
  minLng: Int!
  minLat: Int!
  maxLng: Int!
  maxLat: Int!
}

type Season @entity(immutable: false) {
  id: String! # seasonId
  startTime: BigInt!
  endTime: BigInt!
  isActive: Boolean!
  totalContributions: BigInt!
  participantCount: BigInt!
  contributions: [Contribution!]! @derivedFrom(field: "season")
}

type Contribution @entity(immutable: false) {
  id: Bytes! # txHash-logIndex
  season: Season!
  user: Profile!
  distance: BigInt!
  recordedAt: BigInt!
}

type SeasonParticipant @entity(immutable: false) {
  id: String! # seasonId-participantAddress
  season: Season!
  user: Profile!
  totalContribution: BigInt!
}

type AchievementDefinition @entity(immutable: false) {
  id: Bytes! # achievementId
  name: String!
}

type Achievement @entity(immutable: false) {
  id: String! # tokenId
  recipient: Profile!
  achievementId: Bytes!
  definition: AchievementDefinition
  mintedAt: BigInt!
}

type Challenge @entity(immutable: false) {
  id: String! # challengeId
  challenger: Profile!
  opponent: Profile!
  activityType: Int!
  targetMetric: BigInt!
  deadline: BigInt!
  stake: BigInt!
  status: String! # Open | Accepted | Settled | Cancelled
  winner: Bytes
  loser: Bytes
  payout: BigInt
  createdAt: BigInt!
  withdrawn: Boolean! # true once at least one payout for this challenge has been claimed
  challengerWithdrawn: Boolean! # true once the challenger has claimed their own stake/payout
  opponentWithdrawn: Boolean! # true once the opponent has claimed their own stake/payout
  withdrawnAt: BigInt # timestamp of the most recent withdrawal
}

type Group @entity(immutable: false) {
  id: String! # groupId
  owner: Profile
  name: String!
  location: String!
  description: String!
  sportType: Int!
  memberCount: BigInt!
  createdAt: BigInt!
  active: Boolean! # false once dissolved (owner left as the last member)
  treasuryBalance: BigInt! # wei held in the group's shared on-chain treasury
  members: [GroupMember!]! @derivedFrom(field: "group")
}

type GroupMember @entity(immutable: false) {
  id: String! # groupId-memberAddress
  group: Group!
  user: Profile!
  joinedAt: BigInt!
  active: Boolean! # false once this member has left the group
}

type ActivityKudos @entity(immutable: false) {
  id: Bytes! # activityId-giver
  activity: Activity!
  giver: Profile!
  givenAt: BigInt!
  active: Boolean! # false once revoked
}

type ActivityComment @entity(immutable: false) {
  id: Bytes! # commentId
  activity: Activity!
  author: Profile!
  cid: String!
  createdAt: BigInt!
}

type Event @entity(immutable: false) {
  id: String! # eventId
  host: Profile!
  title: String!
  description: String!
  sportType: Int!
  startTime: BigInt!
  endTime: BigInt!
  distanceGoal: BigInt!
  startLat: Int!
  startLng: Int!
  participantCount: BigInt!
  createdAt: BigInt!
  active: Boolean! # false once cancelled / host-dissolved
  participants: [EventParticipant!]! @derivedFrom(field: "event")
}

type EventParticipant @entity(immutable: false) {
  id: String! # eventId-participantAddress
  event: Event!
  user: Profile!
  joinedAt: BigInt!
  active: Boolean! # false once this participant has left the event
}

# ──────────────────────────────────────────────────────────────
# Substreams-derived entities — composed analytics
# These entities mirror the Substreams pipeline's outputs
# (derive_territory_snapshots, derive_season_standings,
# derive_activity_days), derived here from the same raw events.
# ──────────────────────────────────────────────────────────────

type UserStreak @entity(immutable: false) {
  id: Bytes! # user address
  user: Profile!
  currentStreak: BigInt!
  longestStreak: BigInt!
  lastActiveDay: BigInt!
  totalActiveDays: BigInt!
  updatedAt: BigInt!
}

type LeaderboardSnapshot @entity(immutable: false) {
  id: String! # seasonId-user
  season: Season!
  user: Profile!
  totalDistance: BigInt! # SeasonManager's running season total
  lastContribution: BigInt!
  computedAt: BigInt!
}

type TerritoryStrengthHistory @entity(immutable: false) {
  id: Bytes! # txHash-logIndex
  territory: Territory!
  strength: BigInt!
  changeType: String! # claimed | reinforced | decayed | lost
  blockNumber: BigInt!
  timestamp: BigInt!
}

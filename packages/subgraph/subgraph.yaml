specVersion: 1.0.0
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ProfileRegistry
    network: sepolia
    source:
      address: "0x4Aa7127Aa6Cb07202e4040eA5Aa57434F8B67641"
      abi: ProfileRegistry
      startBlock: 11694692
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Profile
      abis:
        - name: ProfileRegistry
          file: ../contracts/out/ProfileRegistry.sol/ProfileRegistry.json
      eventHandlers:
        - event: ProfileCreated(indexed uint256,indexed address,string,uint256)
          handler: handleProfileCreated
        - event: AvatarUpdated(indexed address,string)
          handler: handleAvatarUpdated
        - event: ProfileVerified(indexed address,bytes32,uint256)
          handler: handleProfileVerified
      file: src/mappings/ProfileRegistry.ts
  - kind: ethereum/contract
    name: ActivityRegistry
    network: sepolia
    source:
      address: "0x8aCAd61B9D875088C010db110d708F85E13e9859"
      abi: ActivityRegistry
      startBlock: 11694692
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Activity
      abis:
        - name: ActivityRegistry
          file: ../contracts/out/ActivityRegistry.sol/ActivityRegistry.json
      eventHandlers:
        - event: ActivityRecorded(indexed uint256,indexed address,indexed bytes32,uint8,uint256,uint256,uint256,uint256)
          handler: handleActivityRecorded
        - event: ActivityMetadataUpdated(indexed uint256,indexed address,string)
          handler: handleActivityMetadataUpdated
      file: src/mappings/ActivityRegistry.ts
  - kind: ethereum/contract
    name: TerritoryRegistry
    network: sepolia
    source:
      address: "0xa5ba09D89C3C6e8F9e84ABD0b73D350220204B6C"
      abi: TerritoryRegistry
      startBlock: 11694692
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Territory
      abis:
        - name: TerritoryRegistry
          file: ../contracts/out/TerritoryRegistry.sol/TerritoryRegistry.json
      eventHandlers:
        - event: TerritoryClaimed(indexed bytes32,indexed address,uint256,bytes32,int32,int32,int32,int32,uint256,uint256)
          handler: handleTerritoryClaimed
        - event: TerritoryReinforced(indexed bytes32,indexed address,uint256,uint256)
          handler: handleTerritoryReinforced
        - event: TerritoryDecayed(indexed bytes32,uint256,uint256)
          handler: handleTerritoryDecayed
        - event: TerritoryLost(indexed bytes32,indexed address,uint256)
          handler: handleTerritoryLost
      file: src/mappings/TerritoryRegistry.ts
  - kind: ethereum/contract
    name: SeasonManager
    network: sepolia
    source:
      address: "0xe1B61aEA4dcD64C2aA20768Dcf94E5a57f7daF65"
      abi: SeasonManager
      startBlock: 11694692
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Season
        - Contribution
        - SeasonParticipant
      abis:
        - name: SeasonManager
          file: ../contracts/out/SeasonManager.sol/SeasonManager.json
      eventHandlers:
        - event: SeasonStarted(indexed uint256,uint256,uint256)
          handler: handleSeasonStarted
        - event: SeasonEnded(indexed uint256,uint256,uint256)
          handler: handleSeasonEnded
        - event: ContributionRecorded(indexed uint256,indexed address,uint256,uint256)
          handler: handleContributionRecorded
      file: src/mappings/SeasonManager.ts
  - kind: ethereum/contract
    name: AchievementRegistry
    network: sepolia
    source:
      address: "0x95d86d385397Cc264f565555c1a1b416A9b784c6"
      abi: AchievementRegistry
      startBlock: 11694692
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Achievement
        - AchievementDefinition
      abis:
        - name: AchievementRegistry
          file: ../contracts/out/AchievementRegistry.sol/AchievementRegistry.json
      eventHandlers:
        - event: AchievementMinted(indexed uint256,indexed address,indexed bytes32)
          handler: handleAchievementMinted
        - event: AchievementDefined(indexed bytes32,string)
          handler: handleAchievementDefined
      file: src/mappings/AchievementRegistry.ts
  - kind: ethereum/contract
    name: ChallengeRegistry
    network: sepolia
    source:
      address: "0x107CDb2828b7efB12Fa01ed4f185822441281787"
      abi: ChallengeRegistry
      startBlock: 11694692
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Challenge
      abis:
        - name: ChallengeRegistry
          file: ../contracts/out/ChallengeRegistry.sol/ChallengeRegistry.json
      eventHandlers:
        - event: ChallengeCreated(indexed uint256,indexed address,indexed address,uint8,uint256,uint256,uint256)
          handler: handleChallengeCreated
        - event: ChallengeAccepted(indexed uint256,indexed address)
          handler: handleChallengeAccepted
        - event: ChallengeSettled(indexed uint256,indexed address,indexed address,uint256)
          handler: handleChallengeSettled
        - event: ChallengeCancelled(indexed uint256,indexed address)
          handler: handleChallengeCancelled
        - event: ChallengeWithdrawn(indexed uint256,indexed address,uint256)
          handler: handleChallengeWithdrawn
      file: src/mappings/ChallengeRegistry.ts
  - kind: ethereum/contract
    name: GroupRegistry
    network: sepolia
    source:
      address: "0xcE8466Ea9BBC35cF3f4516ab2D0aAe3DB919B62d"
      abi: GroupRegistry
      startBlock: 11694692
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Group
        - GroupMember
      abis:
        - name: GroupRegistry
          file: ../contracts/out/GroupRegistry.sol/GroupRegistry.json
      eventHandlers:
        - event: GroupCreated(indexed uint256,indexed address,string,string,string,uint8,uint256)
          handler: handleGroupCreated
        - event: GroupJoined(indexed uint256,indexed address,uint256)
          handler: handleGroupJoined
        - event: GroupLeft(indexed uint256,indexed address,uint256)
          handler: handleGroupLeft
        - event: GroupDissolved(indexed uint256,indexed address,uint256)
          handler: handleGroupDissolved
        - event: GroupOwnershipTransferred(indexed uint256,indexed address,indexed address)
          handler: handleGroupOwnershipTransferred
        - event: TreasuryDeposited(indexed uint256,indexed address,uint256,uint256)
          handler: handleTreasuryDeposited
        - event: TreasuryWithdrawn(indexed uint256,indexed address,uint256,uint256)
          handler: handleTreasuryWithdrawn
      file: src/mappings/GroupRegistry.ts
  - kind: ethereum/contract
    name: SocialRegistry
    network: sepolia
    source:
      address: "0xdd5052dD38c900Da0864FAc5c26b4f41322d9bBC"
      abi: SocialRegistry
      startBlock: 11694692
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ActivityKudos
        - ActivityComment
      abis:
        - name: SocialRegistry
          file: ../contracts/out/SocialRegistry.sol/SocialRegistry.json
      eventHandlers:
        - event: KudosGiven(indexed uint256,indexed address,uint256)
          handler: handleKudosGiven
        - event: KudosRevoked(indexed uint256,indexed address,uint256)
          handler: handleKudosRevoked
        - event: CommentAdded(indexed uint256,indexed address,indexed bytes32,string,uint256)
          handler: handleCommentAdded
      file: src/mappings/SocialRegistry.ts


specVersion: 1.0.0
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ProfileRegistry
    network: sepolia
    source:
      address: "0xa180433C0818518eda0Ac8c3248dCEE388a689dd"
      abi: ProfileRegistry
      startBlock: 11681035
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Profile
      abis:
        - name: ProfileRegistry
          file: ../contracts/out/ProfileRegistry.sol/ProfileRegistry.json
      eventHandlers:
        - event: ProfileCreated(indexed uint256,indexed address,string,uint256)
          handler: handleProfileCreated
        - event: AvatarUpdated(indexed address,string)
          handler: handleAvatarUpdated
      file: src/mappings/ProfileRegistry.ts
  - kind: ethereum/contract
    name: ActivityRegistry
    network: sepolia
    source:
      address: "0xf786Fd52cfCc4c319aC5B43E2F8e856f454Dd5f2"
      abi: ActivityRegistry
      startBlock: 11681042
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Activity
      abis:
        - name: ActivityRegistry
          file: ../contracts/out/ActivityRegistry.sol/ActivityRegistry.json
      eventHandlers:
        - event: ActivityRecorded(indexed uint256,indexed address,indexed bytes32,uint8,uint256,uint256,uint256,uint256)
          handler: handleActivityRecorded
      file: src/mappings/ActivityRegistry.ts
  - kind: ethereum/contract
    name: TerritoryRegistry
    network: sepolia
    source:
      address: "0x52fB04Cf2AD5ed767fc66b0Fc70C70E185446B67"
      abi: TerritoryRegistry
      startBlock: 11681049
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Territory
      abis:
        - name: TerritoryRegistry
          file: ../contracts/out/TerritoryRegistry.sol/TerritoryRegistry.json
      eventHandlers:
        - event: TerritoryClaimed(indexed bytes32,indexed address,uint256,bytes32,int32,int32,int32,int32,uint256,uint256)
          handler: handleTerritoryClaimed
        - event: TerritoryReinforced(indexed bytes32,indexed address,uint256,uint256)
          handler: handleTerritoryReinforced
        - event: TerritoryDecayed(indexed bytes32,uint256,uint256)
          handler: handleTerritoryDecayed
        - event: TerritoryLost(indexed bytes32,indexed address,uint256)
          handler: handleTerritoryLost
      file: src/mappings/TerritoryRegistry.ts
  - kind: ethereum/contract
    name: SeasonManager
    network: sepolia
    source:
      address: "0xe36E17c1C61CE0cE5eF1c5EAF5eb17c60f6ce5Ba"
      abi: SeasonManager
      startBlock: 11681057
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Season
        - Contribution
      abis:
        - name: SeasonManager
          file: ../contracts/out/SeasonManager.sol/SeasonManager.json
      eventHandlers:
        - event: SeasonStarted(indexed uint256,uint256,uint256)
          handler: handleSeasonStarted
        - event: ContributionRecorded(indexed uint256,indexed address,uint256,uint256)
          handler: handleContributionRecorded
      file: src/mappings/SeasonManager.ts
  - kind: ethereum/contract
    name: AchievementRegistry
    network: sepolia
    source:
      address: "0x60EcD3Cc3D29aC475E1d84969B442C41B6d0C91C"
      abi: AchievementRegistry
      startBlock: 11681064
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Achievement
        - AchievementDefinition
      abis:
        - name: AchievementRegistry
          file: ../contracts/out/AchievementRegistry.sol/AchievementRegistry.json
      eventHandlers:
        - event: AchievementMinted(indexed uint256,indexed address,indexed bytes32)
          handler: handleAchievementMinted
        - event: AchievementDefined(indexed bytes32,string)
          handler: handleAchievementDefined
      file: src/mappings/AchievementRegistry.ts
  - kind: ethereum/contract
    name: ChallengeRegistry
    network: sepolia
    source:
      address: "0xA8B8133550F7e9CA15164a3c97a822bdead3e7EE"
      abi: ChallengeRegistry
      startBlock: 11681074
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Challenge
      abis:
        - name: ChallengeRegistry
          file: ../contracts/out/ChallengeRegistry.sol/ChallengeRegistry.json
      eventHandlers:
        - event: ChallengeCreated(indexed uint256,indexed address,indexed address,uint8,uint256,uint256,uint256)
          handler: handleChallengeCreated
        - event: ChallengeAccepted(indexed uint256,indexed address)
          handler: handleChallengeAccepted
        - event: ChallengeSettled(indexed uint256,indexed address,indexed address,uint256)
          handler: handleChallengeSettled
        - event: ChallengeCancelled(indexed uint256,indexed address)
          handler: handleChallengeCancelled
      file: src/mappings/ChallengeRegistry.ts

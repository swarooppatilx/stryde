[package]
name = "stryde-substreams"
version = "0.1.0"
edition = "2021"

[lib]
name = "stryde_substreams"
crate-type = ["cdylib"]

[dependencies]
substreams = "0.7.6"
substreams-ethereum = "0.11.1"
prost = "0.13"
prost-types = "0.13"
hex = "0.4"
hex-literal = "0.4"
ethabi = "17"
num-bigint = "0.4"

[build-dependencies]
substreams-ethereum = "0.11.1"
anyhow = "1"

[profile.release]
opt-level = "s"
strip = true
lto = true
